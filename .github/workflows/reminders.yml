# Wakes the Render app every morning and sends the day 3 / day 30 check-in emails that are due.
# Repository secrets: APP_URL (e.g. https://your-app.onrender.com) and CRON_SECRET (same value as on Render).
name: Check-in reminders
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET is not set"; exit 0; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --max-time 90 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" "$APP_URL/api/cron/reminders"
